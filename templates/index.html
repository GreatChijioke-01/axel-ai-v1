<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axel AI</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>Axel <span>AI</span></h1>
            <p>Powered by CS50</p>        
        </header>

        <div id="chatbox" class="chatbox">
            <div class="message axel-msg">
                <p>Hello! I'm Axel. How can I assist your computing goals today?</p>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="textInput" placeholder="Ask Axel..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>
    <script src="{{url_for('static', filename='js/script.js') }}"></script>
</body>    
</html>
